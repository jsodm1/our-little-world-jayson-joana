<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const el=(id)=>document.getElementById(id);
const storage=(k,fallback)=>{try{return JSON.parse(localStorage.getItem('littleworld_'+k))??fallback}catch{return fallback}};

let letters=storage('letters',[]),images=storage('images',[]),outfit=storage('outfit',{jayson:'#f5f1e4',joana:'#f5e5d0'}),subtitle=storage('subtitle','Somewhere between sea and sky');

const places=[{name:'SUNSET BEACH',quote:'Somewhere between sea and sky',ground:0xe3d2a8,sky:0xd9dbbd,land:0x70896b},{name:'SAKURA GARDEN',quote:'Where every flower remembers us',ground:0xdad8b5,sky:0xe9e2dd,land:0xb4a39a},{name:'LITTLE TOWN',quote:'A home in every little street',ground:0xd5c7ae,sky:0xe7dec9,land:0x7d977a},{name:'STARLIGHT HILL',quote:'The sky is ours tonight',ground:0x7a8b85,sky:0x5f6d89,land:0x405765}];
el('placeQuote').textContent=subtitle;
const scene=new THREE.Scene();scene.background=new THREE.Color(places[0].sky);scene.fog=new THREE.Fog(places[0].sky,38,105);

scene.add(new THREE.HemisphereLight(0xfff8ea,0x6d826e,2.4));const sun=new THREE.DirectionalLight(0xffead2,2.4);sun.position.set(-13,20,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;scene.add(sun);
const mat=(c,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.91,metalness:metal});
const make=(geo,ma,x,y,z,par=scene)=>{const mesh=new THREE.Mesh(geo,ma);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;par.add(mesh);return mesh};
const box=(w,h,d,c,x,y,z,par=scene)=>make(new THREE.BoxGeometry(w,h,d),mat(c),x,y,z,par);
const sphere=(r,c,x,y,z,par=scene)=>make(new THREE.SphereGeometry(r,12,9),mat(c),x,y,z,par);
const cyl=(rt,rb,h,c,x,y,z,par=scene)=>make(new THREE.CylinderGeometry(rt,rb,h,10),mat(c),x,y,z,par);
const world=new THREE.Group();scene.add(world);
const land=make(new THREE.PlaneGeometry(220,220),mat(places[0].ground),0,-.04,0,world);land.rotation.x=-Math.PI/2;land.receiveShadow=true;
let backdrop=new THREE.Group();world.add(backdrop);
function tree(x,z,c=0x839a79){const trunk=cyl(.13,.2,2.2,0x816c58,x,1.1,z,backdrop);const crown=sphere(1.27,c,x,2.8,z,backdrop);crown.scale.set(1.3,.76,1.02)}
function bench(x,z){for(let i=0;i<3;i++)box(3.15,.19,.18,0x9c704c,x,1.12+i*.33,z,backdrop);for(let i of [-1.2,1.2]){box(.13,1.75,.18,0x343c2e,x+i,.89,z,backdrop)}box(3,.16,.8,0x9c704c,x,.74,z+.4,backdrop)}
function house(x,z,c=0xd6c2a1){box(5,3.5,4,c,x,1.75,z,backdrop);const roof=make(new THREE.ConeGeometry(3.9,2.1,4),mat(0x9d786c),x,4.3,z,backdrop);roof.rotation.y=Math.PI/4;box(1.2,2.1,.11,0x8b7059,x,.99,z+2.06,backdrop);for(let side of [-1,1])box(.8,.9,.12,0xc6d4c8,x+side*1.55,2.1,z+2.07,backdrop)}
function setWorld(i){place=i;let p=places[i];scene.background.setHex(p.sky);scene.fog.color.setHex(p.sky);land.material.color.setHex(p.ground);world.remove(backdrop);backdrop=new THREE.Group();world.add(backdrop);
if(i===0){const sea=make(new THREE.PlaneGeometry(220,70),mat(0x739c94,.05),0,.004,-55,backdrop);sea.rotation.x=-Math.PI/2;bench(-4,-8);for(let j=0;j<14;j++)tree(-31+j*5.4,-23+(j%3)*1.2,0x7a9477);box(8,.13,4,0xb79c7c,13,.04,-24,backdrop)}
if(i===1){for(let j=0;j<19;j++){let ang=j/19*Math.PI*2;tree(Math.cos(ang)*19,Math.sin(ang)*17,j%2?0xd9abb9:0xedc6d4)}bench(-4,-8);sphere(1.8,0xe3c5d1,14,1.5,-12,backdrop)}
if(i===2){house(-11,-12,0xd9baa2);house(9,-13,0xc4c9a5);house(18,0,0xdacbb4);for(let j=0;j<12;j++)tree(-29+j*5.4,17,0x85977b);bench(-4,-8)}
if(i===3){for(let j=0;j<20;j++)tree(-27+j*3.1,-25+j%4,0x516d6d);bench(-4,-8);for(let j=0;j<45;j++){let x=Math.sin(j*13.7)*26,z=Math.cos(j*6.8)*23;const b=sphere(.045,0xffe2a0,x,2+j%9*.7,z,backdrop);b.material.emissive.setHex(0xefd3a0)}}el('placeName').textContent=p.name;el('placeQuote').textContent=i===0?subtitle:p.quote;}
function nameSprite(label){const cv=document.createElement('canvas');cv.width=256;cv.height=70;const ctx=cv.getContext('2d');ctx.fillStyle='#fdf8e9';ctx.beginPath();ctx.roundRect(8,8,240,54,22);ctx.fill();ctx.fillStyle='#4b5149';ctx.textAlign='center';ctx.font='26px Arial';ctx.fillText(label,128,44);const tx=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false}));sp.scale.set(1.6,.44,1);sp.position.y=3.65;return sp}
function avatar(label,isGirl){const group=new THREE.Group();scene.add(group);const body=new THREE.Group();group.add(body);
const skin=mat(isGirl?0xdba588:0xc78c65),hair=mat(isGirl?0x493229:0x231e18),top=mat(isGirl?outfit.joana:outfit.jayson),pants=mat(isGirl?0xf1e5d4:0x242826),shoe=mat(isGirl?0x957263:0x272826);
const torso=box(.82,1.14,.43,0xffffff,0,1.77,0,body);torso.material=top;
const neck=cyl(.13,.13,.24,0xb88969,0,2.46,0,body);neck.material=skin;
const head=sphere(.43,0xdbad87,0,2.94,0,body);head.material=skin;head.scale.set(1,.99,.86);
sphere(.44,0x342922,0,3.16,-.06,body).material=hair;
for(let d of [-1,1]){sphere(.037,0x31291f,d*.16,2.98,.35,body);const arm=new THREE.Group();arm.position.set(d*.56,2.2,0);body.add(arm);const a=cyl(.135,.115,.8,0xdba588,0,-.37,0,arm);a.material=skin;arm.userData.swing=d;body.userData['arm'+d]=arm;
const leg=new THREE.Group();leg.position.set(d*.22,1.21,0);body.add(leg);box(.31,.89,.32,0x252524,0,-.43,0,leg).material=pants;box(.35,.17,.48,0x272826,0,-.88,.1,leg).material=shoe;body.userData['leg'+d]=leg}
if(isGirl){for(let d of [-1,1]){box(.11,1.38,.29,0x432b29,d*.4,2.53,-.08,body).material=hair}const skirt=make(new THREE.CylinderGeometry(.41,.72,.73,12),top,0,1.22,0,body);skirt.castShadow=true}else{for(let d of [-1,1])sphere(.17,0x27221c,d*.28,3.24,-.01,body).material=hair}
body.add(nameSprite(label));return {group,body,top,arms:[body.userData['arm-1'],body.userData['arm1']],legs:[body.userData['leg-1'],body.userData['leg1']]}}
const jay=avatar('Jayson',false),jo=avatar('Joana · preview',true);jay.group.position.set(0,0,3.3);jo.group.position.set(-3.5,0,1.2);
let yaw=0.15,pitch=.26;function updateCamera(){const dist=8.7,base=new THREE.Vector3(jay.group.position.x,1.75,jay.group.position.z);const desired=base.clone().add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist+1.2,Math.cos(yaw)*Math.cos(pitch)*dist));camera.position.lerp(desired,.11);camera.lookAt(base)}
function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;const x=move.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),y=move.y+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),len=Math.hypot(x,y);if(len>.08){const vx=x/len,vz=y/len,ang=Math.atan2(vx,vz)+yaw;const spd=(run||keys.Shift?5.1:2.55)*dt;jay.group.position.x+=Math.sin(ang)*spd;jay.group.position.z+=Math.cos(ang)*spd;jay.group.position.x=THREE.MathUtils.clamp(jay.group.position.x,-43,43);jay.group.position.z=THREE.MathUtils.clamp(jay.group.position.z,-32,41);jay.group.rotation.y=ang;jay.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*.012+(i*Math.PI))*.46);jay.arms.forEach((a,i)=>a.rotation.x=Math.sin(t*.012+(i*Math.PI))*.23)}else{jay.legs.forEach(l=>l.rotation.x*=.81);jay.arms.forEach(a=>a.rotation.x*=.81)}
if(action && t-actionStart<1800){const n=(t-actionStart)/1800;for(let a of jay.arms)a.rotation.z=(a===jay.arms[0]?-1:1)*(.35+Math.sin(n*Math.PI)*.55);if(action==='Hug'||action==='Kiss'||action==='Hold hands'){let dx=jo.group.position.x-jay.group.position.x,dz=jo.group.position.z-jay.group.position.z;jay.group.rotation.y=Math.atan2(dx,dz);jo.group.rotation.y=jay.group.rotation.y+Math.PI}}else action='';
const bob=Math.sin(t*.0017)*.022;jo.body.position.y=bob;updateCamera();renderer.render(scene,camera)}
setWorld(0);animate(performance.now());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return; yaw-=(e.clientX-drag.x)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-drag.y)*.003,-.02,.9);drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=null);
const joystick=el('joystick'),stick=el('stick');function joyMove(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,div=Math.max(Math.hypot(dx,dy),1),rad=Math.min(div,35);stick.style.transform='translate('+(dx/div*rad)+'px,'+(dy/div*rad)+'px)';move={x:dx/Math.max(div,35)*Math.min(div/35,1),y:dy/Math.max(div,35)*Math.min(div/35,1)}}joystick.addEventListener('pointerdown',e=>{joystick.setPointerCapture(e.pointerId);joyMove(e)});joystick.addEventListener('pointermove',e=>{if(joystick.hasPointerCapture(e.pointerId))joyMove(e)});const stopJoy=()=>{move={x:0,y:0};stick.style.transform=''};joystick.addEventListener('pointerup',stopJoy);joystick.addEventListener('pointercancel',stopJoy);
function toast(msg){el('toast').textContent=msg;el('toast').style.opacity=1;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el('toast').style.opacity=0,2800)}
const drawer=el('drawer'),content=el('panelContent');function openPanel(which){drawer.classList.add('open');content.replaceChildren();const title=document.createElement('h2');title.textContent=({places:'Our places',memories:'Our memories',letters:'Love letters',customize:'Our wardrobe',together:'Together',sound:'Our music',about:'About this world'})[which];content.append(title);
const p=(str)=>{const node=document.createElement('p');node.textContent=str;content.append(node);return node};
const btn=(text,cb,cl='secondary')=>{const b=document.createElement('button');b.className=cl;b.textContent=text;b.onclick=cb;content.append(b);return b};
const inp=(placeholder,value='',tag='input')=>{const a=document.createElement(tag);a.className='field';a.placeholder=placeholder;a.value=value;content.append(a);return a};
if(which==='places'){p('Choose a location. Every destination is an explorable 3D preview.');const row=document.createElement('div');row.className='list';content.append(row);places.forEach((q,i)=>{let b=document.createElement('button');b.className='tile'+(i===place?' active':'');b.textContent=q.name;b.onclick=()=>{setWorld(i);drawer.classList.remove('open');toast('Welcome to '+q.name.toLowerCase())};row.append(b)})}
if(which==='letters'){p('Write and keep letters on this device. Shared private letters will be available after the multiplayer backend is connected.');const letter=inp('Write a little love letter…','','textarea');letter.rows=4;btn('Save love letter ♡',()=>{const v=letter.value.trim();if(!v)return toast('Write your letter first');letters.unshift({text:v,date:new Date().toLocaleDateString()});save('letters',letters);openPanel('letters');toast('Letter saved to this device')},'primary');letters.forEach((l,i)=>{const n=document.createElement('div');n.className='note';n.textContent=l.text+'\n'+l.date;content.append(n);btn('Delete letter '+(i+1),()=>{letters.splice(i,1);save('letters',letters);openPanel('letters')})})}
if(which==='memories'){p('Add portrait photos from this phone. For this preview, photos are compressed and stored only in this browser.');const upload=document.createElement('input');upload.type='file';upload.accept='image/*';upload.className='field';content.append(upload);upload.onchange=async()=>{const file=upload.files?.[0];if(!file)return;const url=URL.createObjectURL(file);const image=new Image();image.onload=()=>{const cv=document.createElement('canvas');const scale=Math.min(1,700/Math.max(image.width,image.height));cv.width=Math.round(image.width*scale);cv.height=Math.round(image.height*scale);cv.getContext('2d').drawImage(image,0,0,cv.width,cv.height);images.unshift(cv.toDataURL('image/jpeg',.68));images=images.slice(0,6);try{save('images',images);openPanel('memories');toast('Photo saved locally')}catch{toast('Browser storage is full. Remove older photos.')}URL.revokeObjectURL(url)};image.src=url};const grid=document.createElement('div');grid.className='photoGrid';content.append(grid);images.forEach(src=>{let im=document.createElement('img');im.src=src;grid.append(im)});if(images.length)btn('Clear local photos',()=>{if(confirm('Delete all photos saved in this browser?')){images=[];save('images',images);openPanel('memories')}})}
if(which==='customize'){p('Change the character colors in the demo. The complete illustrated outfit collections need custom rigged 3D assets.');const colors=['#f5f1e4','#577696','#33352f','#b56d76','#d3b693','#8b414a','#e1cabc'];for(const [name,char] of [['Jayson',jay],['Joana',jo]]){const h=document.createElement('p');h.textContent=name+' — outfit color';content.append(h);for(const color of colors){const b=document.createElement('button');b.style.cssText='width:35px;height:35px;border-radius:50%;margin:5px;border:2px solid white;background:'+color;b.setAttribute('aria-label',name+' '+color);b.onclick=()=>{char.top.color.set(color);outfit[name.toLowerCase()]=color;save('outfit',outfit);toast(name+"'s outfit updated")};content.append(b)}}}
if(which==='together'){p('These are short visual interaction previews. Joana is not a remote player yet, and real synchronized multiplayer animations are still in development.');for(const a of ['Hug','Kiss','Hold hands','Wave','Dance','Sit together'])btn(a+' ♡',()=>{if(['Hug','Kiss','Hold hands'].includes(a)){const off=new THREE.Vector3(1.2,0,.15).applyAxisAngle(new THREE.Vector3(0,1,0),jay.group.rotation.y);jo.group.position.copy(jay.group.position).add(off)}action=a;actionStart=performance.now();toast(a+' — preview pose');drawer.classList.remove('open')})}

}
